aid: zulily
name: Zulily
description: >-
  Zulily is an online retailer of daily deals on apparel, home, toys, and lifestyle goods. After
  its 2023 shutdown the brand was acquired and relaunched as a Shopify-hosted store. The relaunched
  storefront is agent-native: it implements the Universal Commerce Protocol (UCP) with a JSON-RPC
  MCP shopping endpoint, exposes OpenID Connect / OAuth 2.0 authentication via the Shopify Customer
  Account API (including a customer-account-mcp-api scope), and publishes an llms.txt / agents.md
  describing how AI shopping agents can discover products and run buyer-approved checkouts. This
  profile was surfaced as an a16z / Trinity Ventures portfolio company and enriched from Zulily's
  real public agent-commerce surface.
